[project]
name = "dinnerbell"
version = "0.0.0" # The real version lives in ../VERSION (see docs/adr/0019-versioning.md).
description = "Dinner Bell: household meal planning and grocery lists."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "httpx>=0.28",
    "cryptography>=50",
    "tzdata>=2025.2",
]

[project.scripts]
dinnerbell = "dinnerbell.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-socket>=0.7",
    "hypothesis>=6.168",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "watchfiles>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinnerbell"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["src/dinnerbell/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "RUF", "S", "ASYNC", "DTZ"]
ignore = [
    "S101", # assert is fine in tests and for invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/dinnerbell/migrations/versions"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportPrivateUsage = false },
    { root = "src" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "kroger_live: talks to the real Kroger API (opt-in; needs local credentials)",
]
